version: "3.8"
services:
  db:
    image: postgres:15
    container_name: mealmind_db
    restart: always
    env_file:
      - ./backend/.env
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    #   POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - mealmind_pgdata:/var/lib/postgresql/data
volumes:
  mealmind_pgdata:
